<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 128" role="img" aria-label="Baudly">
  <title>Baudly — horizontal lockup (for dark surfaces)</title>
  <defs>
    <linearGradient id="h-light-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C6BFF"/>
      <stop offset="1" stop-color="#5440E6"/>
    </linearGradient>
    <linearGradient id="h-light-hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Icon at 96x96, left-aligned -->
  <g transform="translate(8,16)">
    <rect width="96" height="96" rx="21" fill="url(#h-light-bg)"/>
    <rect width="96" height="96" rx="21" fill="url(#h-light-hl)"/>
    <!-- scale the master glyph (512 → 96, factor 0.1875) -->
    <g transform="scale(0.1875)">
      <rect x="128" y="96" width="56" height="336" rx="28" fill="#ffffff"/>
      <circle cx="280" cy="328" r="80" fill="none" stroke="#ffffff" stroke-width="56"/>
      <rect x="132" y="58" width="48" height="16" rx="8" fill="#ffffff"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="128" y="88"
        font-family="Inter, 'Geist', 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif"
        font-size="72"
        font-weight="700"
        letter-spacing="-2.2"
        fill="#E9E9EF">Baudly</text>
</svg>
